name: 매매전략 데이터 마감 직후 배포

# 전략 저장소(kis-buy-signal)는 미국 정규장 마감 직후 16:02 ET(겨울 06:02 KST, 여름 05:02 KST)에 daily.yml을 시작해
# 약 6~8분 뒤 data 브랜치에 새 데이터를 올린다. 이 워크플로는 16:05 ET부터 30초마다 data 브랜치를 확인해 올라오는 즉시
# deploy.yml을 실행한다(목표 화면 반영 ≈ 16:12 ET = 겨울 06:12 KST).
#
# 왜 '스스로 잇는 시계'인가: GitHub 예약(schedule)은 하루 1번꼴, 몇 시간 늦게만 돈다(2026-11 실측). 그래서
# GitHub 환경 `clock-4h`의 대기 타이머(240분 — 러너 없이 기다림)로 한 칸을 기다리고, 칸이 끝나면 이 워크플로를
# workflow_dispatch로 다시 실행해(GITHUB_TOKEN으로 즉시 생성) 사슬을 잇는다. 구조는 전략 저장소 us-close-timer.yml과 같다.
#   plan  — 먼저 '데이터는 새것인데 배포가 안 됨'이면 바로 배포(늦게 깨거나 대체 실행분도 다음 칸 안에 반영).
#           그다음 목표(다음 평일 16:05 ET)까지 남은 시간 계산. 이미 도는 사슬이 있으면 stop.
#   wait  — 남은 시간이 대기 한 칸 + 10분보다 길면 환경 대기 타이머로 기다림(러너 없음)
#   fire  — 그 안이면 목표까지 sleep → 최대 90분 동안 30초마다 data 브랜치 확인 → 올라오면 deploy.yml
#   relay — wait가 끝났거나 fire가 성공했으면 다음 칸(시험 실행은 fire 뒤 잇지 않음)
# 예약(schedule)은 사슬이 끊겼을 때 다시 잇는 대체일 뿐이다. deploy.yml의 2시간 예약 확인도 그대로 둔다.
# 끄려면: Actions → 이 워크플로 → Disable workflow.
# 보안: 비밀값·checkout·제3자 액션 없음, 권한은 job별 최소(actions만), 입력값은 env로만 받아 형식 검사.
on:
  schedule:
    - cron: "29 */3 * * *"
  workflow_dispatch:
    inputs:
      from_run:
        description: "(사슬 내부용 — 비워 두세요) 이 실행을 부른 앞 칸 run id"
        required: false
        default: ""
      target:
        description: "(시험용) 감시 시작 시각 ISO, 예 2026-11-25T03:13:00Z — 그 3분 전 이후 data 커밋을 새 데이터로 본다. 지정하면 시험 실행(환경 clock-test, fire 뒤 사슬을 잇지 않음)"
        required: false
        default: ""
      dry:
        description: "(시험용) true면 deploy.yml을 실행하지 않고 '실행했을 것'만 기록"
        required: false
        default: "false"

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # 동기화 점검에서 deploy.yml 실행
    outputs:
      next: ${{ steps.p.outputs.next }}
      target: ${{ steps.p.outputs.target }}
      env: ${{ steps.p.outputs.env }}
      test: ${{ steps.p.outputs.test }}
      dry: ${{ steps.p.outputs.dry }}
    steps:
      - name: Sync check, then plan the next step of the clock
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          IN_FROM_RUN: ${{ inputs.from_run }}
          IN_TARGET: ${{ inputs.target }}
          IN_DRY: ${{ inputs.dry }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, re, subprocess, sys, zoneinfo

          NY = zoneinfo.ZoneInfo("America/New_York")
          UTC = dt.timezone.utc
          WF = "signals-watch.yml"
          FIRE_AT = dt.time(16, 5)            # 평일 이 시각(ET)부터 감시
          LEAD = dt.timedelta(minutes=3)      # 감시 시작 3분 전(= daily.yml 시작 16:02 ET) 뒤의 data 커밋 = 새 데이터
          WATCH = dt.timedelta(minutes=90)    # 감시 시간
          MARGIN = 10
          FIRE_MAX = 250
          RUNAWAY = 30
          ALIVE = {"queued", "in_progress", "waiting", "pending", "requested"}

          def gh(*a):
              return subprocess.run(["gh", *a], check=True, capture_output=True, text=True).stdout

          def utc(s):
              return dt.datetime.fromisoformat(s.replace("Z", "+00:00"))

          def parse_inputs(e):
              fr = (e.get("IN_FROM_RUN") or "").strip()
              tg = (e.get("IN_TARGET") or "").strip()
              dry = (e.get("IN_DRY") or "false").strip().lower()
              if fr and not re.fullmatch(r"\d{1,20}", fr):
                  raise ValueError("from_run은 숫자만")
              if dry not in ("true", "false"):
                  raise ValueError("dry는 true/false만")
              t = None
              if tg:
                  if not re.fullmatch(r"\d{4}-\d\d-\d\dT\d\d:\d\d(:\d\d)?(Z|[+-]\d\d:\d\d)", tg):
                      raise ValueError("target 형식 오류(예: 2026-11-25T03:13:00Z)")
                  t = utc(tg)
              return (int(fr) if fr else None), t, dry == "true"

          def next_target(now, done):
              """다음 감시 시작(뉴욕 평일 FIRE_AT). 오늘 것이 지났어도 감시 시간 안이고 아직 배포 전이면 오늘 것(바로 감시)."""
              for i in range(8):
                  day = now.date() + dt.timedelta(days=i)
                  if day.weekday() >= 5:
                      continue
                  t = dt.datetime.combine(day, FIRE_AT, NY)
                  if t > now or (i == 0 and now < t + WATCH and not done(t)):
                      return t
              raise RuntimeError("다음 평일을 찾지 못함")

          def decide(now, target, hop):
              left = (target - now).total_seconds() / 60
              if hop is not None and left > hop + MARGIN:
                  return "wait"
              if left > FIRE_MAX:
                  raise RuntimeError("환경 대기 타이머를 확인하지 못해 기다릴 수 없음 — 환경 clock-4h(wait_timer 240)를 확인하세요")
              return "fire"

          def older_alive(runs, me, prev):
              return [r for r in runs if r["status"] in ALIVE and r["databaseId"] not in (me, prev) and r["databaseId"] < me]

          def runaway(runs, now_utc):
              return sum(1 for r in runs if now_utc - utc(r["createdAt"]) < dt.timedelta(hours=1)) > RUNAWAY

          def env_wait(repo, name):
              try:
                  j = json.loads(gh("api", f"repos/{repo}/environments/{name}"))
              except Exception as ex:
                  print(f"::warning::환경 {name} 확인 실패({ex})"); return None
              w = [r.get("wait_timer") for r in j.get("protection_rules") or [] if r.get("type") == "wait_timer"]
              return w[0] if w and isinstance(w[0], int) and 1 <= w[0] <= FIRE_MAX - MARGIN else None

          def data_time():
              return utc(gh("api", "repos/withgest-lab/kis-buy-signal/commits/data", "--jq", ".commit.committer.date").strip())

          def deployed_since(repo, t):
              runs = json.loads(gh("run", "list", "-R", repo, "--workflow", "deploy.yml", "-L", "20", "--json", "createdAt"))
              return any(utc(r["createdAt"]) >= t for r in runs)

          def out(**kv):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  for k, v in kv.items():
                      f.write(f"{k}={v}\n")

          def main():
              e = os.environ
              repo, me = e["REPO"], int(e["RUN_ID"])
              try:
                  prev, test_target, dry = parse_inputs(e)
              except ValueError as ex:
                  print(f"::error::입력값 오류: {ex}"); sys.exit(1)
              runs = json.loads(gh("run", "list", "-R", repo, "--workflow", WF, "-L", "60", "--json", "databaseId,status,createdAt"))
              if runaway(runs, dt.datetime.now(UTC)):
                  print(f"::error::최근 1시간 실행이 {RUNAWAY}개를 넘음 — 폭주 차단으로 멈춤(환경 대기 타이머 확인)"); sys.exit(1)
              if older_alive(runs, me, prev):
                  print("이미 도는 사슬이 있음 → 이 실행은 여기서 끝"); out(next="stop"); return
              # 동기화 점검: data 브랜치가 마지막 배포보다 새것이면 바로 배포(늦게 깬 날·대체 실행분)
              try:
                  d = data_time()
                  if not deployed_since(repo, d):
                      if dry:
                          print(f"(dry) data {d:%m-%d %H:%M}Z가 아직 배포 전 — deploy.yml을 실행했을 것")
                      else:
                          gh("workflow", "run", "deploy.yml", "-R", repo, "--ref", "main")
                          print(f"data {d:%m-%d %H:%M}Z가 아직 배포 전 → deploy.yml 실행 요청")
              except Exception as ex:
                  print(f"::warning::동기화 점검 실패({ex}) — 사슬은 계속")
              test = test_target is not None
              env_name = "clock-test" if test else "clock-4h"
              hop = env_wait(repo, env_name)
              now = dt.datetime.now(NY)

              def done(t):   # 오늘 마감 뒤 데이터가 올라와 배포까지 됐나
                  d = data_time()
                  return d >= t - LEAD and deployed_since(repo, d)

              target = test_target.astimezone(NY) if test else next_target(now, done)
              nxt = decide(now, target, hop)
              left = (target - now).total_seconds() / 60
              print(f"뉴욕 {now:%a %H:%M:%S} · 감시 시작 {target:%a %m-%d %H:%M} ET(한국 {target.astimezone(zoneinfo.ZoneInfo('Asia/Seoul')):%m-%d %H:%M}) · "
                    f"남은 {left:.0f}분 · 대기 칸 {hop}분 → {nxt}{' (시험)' if test else ''}{' (dry)' if dry else ''}")
              out(next=nxt, target=target.isoformat(), env=env_name, test=str(test).lower(), dry=str(dry).lower())

          if __name__ == "__main__":
              main()
          EOF

  wait:
    needs: plan
    if: needs.plan.outputs.next == 'wait'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    # 환경의 대기 타이머(clock-4h 240분 / clock-test 1분)만큼 이 job 시작이 늦춰진다 — 그동안 러너를 쓰지 않는다.
    environment: ${{ needs.plan.outputs.env }}
    steps:
      - name: Waited one hop
        run: echo "대기 한 칸 끝 → 다음 칸"

  fire:
    needs: plan
    if: needs.plan.outputs.next == 'fire'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
    steps:
      - name: Deploy as soon as post-close strategy data lands
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ needs.plan.outputs.target }}
          DRY: ${{ needs.plan.outputs.dry }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, subprocess, time, zoneinfo
          NY = zoneinfo.ZoneInfo("America/New_York")
          repo, dry = os.environ["REPO"], os.environ["DRY"] == "true"
          target = dt.datetime.fromisoformat(os.environ["TARGET"])
          start, end = target - dt.timedelta(minutes=3), target + dt.timedelta(minutes=90)

          def gh(*a):
              return subprocess.run(["gh", *a], check=True, capture_output=True, text=True).stdout

          def utc(s):
              return dt.datetime.fromisoformat(s.replace("Z", "+00:00"))

          def data_time():
              return utc(gh("api", "repos/withgest-lab/kis-buy-signal/commits/data", "--jq", ".commit.committer.date").strip())

          def deployed_since(t):
              runs = json.loads(gh("run", "list", "-R", repo, "--workflow", "deploy.yml", "-L", "20", "--json", "createdAt"))
              return any(utc(r["createdAt"]) >= t for r in runs)

          wait = (target - dt.datetime.now(NY)).total_seconds()
          if wait > 0:
              print(f"감시 시작 {target.astimezone(NY):%H:%M:%S} ET까지 {wait / 60:.1f}분 대기"); time.sleep(wait)
          while True:
              try:
                  d = data_time()
              except Exception as ex:
                  print(f"data 브랜치 확인 실패({ex}) — 다시 시도"); d = None
              if d is not None and d >= start:
                  if deployed_since(d):
                      print("새 데이터가 이미 배포됨"); break
                  if dry:
                      print("(dry) deploy.yml을 실행했을 것")
                  else:
                      gh("workflow", "run", "deploy.yml", "-R", repo, "--ref", "main")
                  now = dt.datetime.now(NY)
                  print(f"새 데이터({d.astimezone(NY):%H:%M:%S} ET 커밋) 확인 → deploy.yml 실행 요청 — 뉴욕 {now:%H:%M:%S} "
                        f"(데이터보다 {(now - d).total_seconds():+.0f}초)")
                  break
              if dt.datetime.now(NY) > end:
                  print("::warning::감시 90분 안에 새 데이터가 없음 — 전략 저장소 daily.yml 실행 상태를 확인하세요(다음 칸의 동기화 점검이 뒤늦은 데이터도 배포)")
                  break
              time.sleep(30)
          EOF

  relay:
    needs: [plan, wait, fire]
    if: >-
      always() && needs.plan.result == 'success' && (
        (needs.plan.outputs.next == 'wait' && needs.wait.result == 'success') ||
        (needs.plan.outputs.next == 'fire' && needs.fire.result == 'success' && needs.plan.outputs.test != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Start the next hop of the clock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TEST: ${{ needs.plan.outputs.test }}
          IN_TARGET: ${{ inputs.target }}
          DRY: ${{ needs.plan.outputs.dry }}
        run: |
          set -euo pipefail
          args=(-f from_run="$RUN_ID")
          if [ "$TEST" = "true" ]; then args+=(-f target="$IN_TARGET" -f dry="$DRY"); fi
          gh workflow run signals-watch.yml -R "$REPO" --ref main "${args[@]}"
          echo "다음 칸 실행 요청"
